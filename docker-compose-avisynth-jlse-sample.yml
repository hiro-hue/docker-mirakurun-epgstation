version: '3.7'
services:
    mirakurun:
        # 自前フォーク（hiro-hue/Mirakurun、private、submodule: mirakurun/src）から、
        # libyakisoba/libsobacas/libaribb25（softcasの後継、B-CASカードリーダー不要でB25復号）
        # 込みでビルドする。`git submodule update --init` に private repo への
        # アクセス権（SSH鍵）が必要。詳細は docs/mirakurun-libaribb25-diff.md を参照。
        build:
            context: "./mirakurun/src"
            dockerfile: "docker/Dockerfile"
        cap_add:
            - SYS_ADMIN
            - SYS_NICE
        device_cgroup_rules:
            - 'c *:* rmw'
        network_mode: host
        volumes:
            - ./mirakurun/conf:/app-config
            - ./mirakurun/data:/app-data
            - ./mirakurun/run:/var/run
            - ./mirakurun/opt:/opt
        tmpfs:
            - /tmp
        environment:
            TZ: "Asia/Tokyo"
            DOCKER_NETWORK: host
            DISABLE_PCSCD: "0"
            DISABLE_B25_TEST: "0"
            # B-CAS鍵をイメージに焼き込まず、ホスト側ファイルの差し替えだけで
            # 更新したい場合に指定する（例: ./mirakurun/conf/bcas_keys）。
            # 未設定の場合、submodule内にビルド時に焼き込まれた既定の鍵が使われる。
            #BCAS_KEYS_FILE: /app-config/bcas_keys
        devices:
            - /dev/bus:/dev/bus
            - /dev/dvb:/dev/dvb
        restart: always
        logging:
            driver: json-file
            options:
                max-file: "1"
                max-size: 10m

    epgstation:
        # EPGStation v2.10.0 + JLSE（CMカット/チャプター生成）を Ubuntu 24.04 / FFmpeg 8.0 /
        # AviSynth+ v3.7.5 の上でゼロからビルドする。詳細は docs/avisynth-jlse-diff.md を参照。
        build:
            context: "./epgstation"
            dockerfile: "avisynth-jlse.Dockerfile"
        volumes:
            - ./epgstation/config:/app/config
            - ./epgstation/data:/app/data
            - ./epgstation/thumbnail:/app/thumbnail
            - ./epgstation/logs:/app/logs
            - ./recorded:/app/recorded
        environment:
            TZ: "Asia/Tokyo"
        depends_on:
            - mirakurun
        ports:
            - "8888:8888"
            - "8889:8889"
#         user: "1000:1000"
#         devices:
#             - /dev/dri:/dev/dri
        restart: always
